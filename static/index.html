<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>勤怠管理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div>
          <h1>勤怠管理</h1>
          <p class="sub">打刻と当日の勤務時間をすぐに確認できます。</p>
        </div>
        <div class="today" id="today-label"></div>
      </div>
      
      <div id="login-panel" class="panel login-panel">
        <div class="login-header">
          <div>
            <p class="panel-title">ログイン</p>
            <p class="login-hint">ユーザー名でログインすると打刻が有効になります。</p>
          </div>
          <div class="login-badge">安全なデモ</div>
        </div>
        <label class="login-label" for="login-name">ユーザー名</label>
        <div class="login-field">
          <input id="login-name" type="text" placeholder="例：山田太郎" autocomplete="username" />
          <label class="login-label" for="login-pin">PIN (4桁)</label>
          <div class="login-field">
            <input id="login-pin" type="password" inputmode="numeric" maxlength="4" placeholder="例： 1234" autocomplete="one-time-code" />
          </div>
        </div>
        <div class="login-actions">
          <button class="primary" onclick="login()">ログイン</button>
          <button class="secondary" onclick="logout()">ログアウト</button>
        </div>
      </div>

      <div class="user-input">
        <div class="user-row">
          <label for="user-name">ユーザー名</label>
          <input id="user-name" type="text" value="山田太郎" />
        </div>
        <div class="user-actions">
          <span class="login-state" id="login-state"></span>
          <button class="secondary" onclick="logout()">ログアウト</button>
        </div>
      </div>

      <div class="actions">
        <button class="primary" onclick="callApi('/clock-in')">入室</button>
        <button class="accent" onclick="callApi('/clock-out')">退室</button>
      </div>

      <div class="panel" id="today-note-section">
        <p class="panel-title">本日の備考</p>
        <textarea id="today-note-input" rows="3" placeholder="本日の備考を入力してください"></textarea>
        <div class="footer">
          <button class="secondary" id="save-today-note-btn" type="button" onclick="saveTodayNote()">備考を保存</button>
          <div id="today-note-status"></div>
        </div>
      </div>

      <div class="panel">
        <p class="panel-title">操作ステータス</p>
        <div id="status">準備完了</div>
      </div>

      <div class="panel">
        <p class="panel-title">現在の状態</p>
        <div id="current-state">取得中...</div>
        <div id="location-info" style="font-size: 13px; color: #555;"></div>
      </div>

      <div class="panel">
        <p class="panel-title">今日の勤務時間</p>
        <div class="result" id="result">まだ計算されていません</div>
        <div class="footer">
          <button class="secondary" onclick="loadWorkTime()">勤務時間を更新</button>
        </div>
      </div>

      <div class="panel">
        <p class="panel-title">今日のログ</p>
        <table>
          <thead>
            <tr>
              <th>ユーザー</th>
              <th>アクション</th>
              <th>時刻</th>
            </tr>
          </thead>
          <tbody id="log-table"></tbody>
        </table>
        <div class="footer">
          <button class="secondary" onclick="loadLogs()">ログを更新</button>
        </div>
      </div>

      <div class="panel">
        <p class="panel-title">今月のサマリー</p>

        <div class="result" id="month-summary-result">まだ取得していません</div>

        <div class="footer" style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="secondary" onclick="loadMonthSummary()">今月のサマリーを更新</button>
        </div>

        <div id="month-summary-detail" style="margin-top:10px; font-size:13px; color:#555;"></div>
      </div>

      <div class="panel" id="previous-month-confirm-section">
        <p class="panel-title">先月の勤務実績</p>
        <div class="result" id="previous-month-summary">まだ取得していません</div>
        <div id="previous-month-confirm-status" style="margin-top:10px; font-size:13px; color:#555;"></div>
        <div id="previous-month-logs" style="margin-top:12px;"></div>
        <div class="footer" style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="primary" id="confirm-previous-month-btn" onclick="confirmPreviousMonth()">内容を確認しました</button>
          <button class="secondary" onclick="loadPreviousMonthSection()">先月分を更新</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js?v=3"></script>
  </body>
</html>
