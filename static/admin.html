<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>勤怠管理 | 管理者</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      .admin-controls .field-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        align-items: stretch;
        width: 100%;
        min-width: 0;
      }
      .admin-controls .field-row > *,
      .admin-grid > * {
        min-width: 0;
        max-width: 100%;
      }
      .admin-controls input,
      .admin-controls select {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 15px;
      }
      .admin-actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
        align-items: center;
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
      }
      .admin-actions > * {
        min-width: 0;
        max-width: 100%;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 20px;
        width: 100%;
        min-width: 0;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .status.ok { color: var(--accent); }
      .status.error { color: #b54836; }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .admin-login {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .admin-login .status-row {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .admin-login .action-row {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
      }
      #login-state {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .admin-login .action-row button {
        width: 100%;
      }
      @media (min-width: 720px) {
        .admin-login {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
        .admin-login .status-row {
          flex: 1;
        }
        .admin-login .action-row {
          width: auto;
          justify-content: flex-end;
        }
        .admin-login .action-row button {
          width: auto;
        }
      }
      @media (min-width: 900px) {
        .admin-controls .field-row > .panel {
          grid-column: span 2;
        }
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f8efe1;
        border: 1px solid #e8dcc8;
        color: #8d6a46;
      }
      .pill {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f2f6f5;
        color: var(--accent);
        border: 1px solid #d9e4e1;
        display: inline-block;
      }
      .table-compact td,
      .table-compact th {
        padding: 8px 6px;
      }
      .detail-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .detail-panel-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .table-wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .table-wrap table {
        min-width: 560px;
      }
      .detail-reset {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 999px;
      }
      .detail-toggle {
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 999px;
      }
      .detail-summary {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .action-cell {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        min-width: 0;
      }
      .action-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }
      .action-item {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid #e8dcc8;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
      }
      .action-item.editing {
        border-color: #d7b067;
        background: #fff8ea;
      }
      .action-time {
        min-width: 58px;
        font-variant-numeric: tabular-nums;
      }
      .inline-time {
        width: 110px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #d6c4a7;
      }
      .mini-btn {
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 999px;
      }
      .full-day-add {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        margin-top: 4px;
      }
      .full-day-fields {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
        padding: 6px 8px;
        border: 1px dashed #d6c4a7;
        border-radius: 10px;
        background: #fffdf7;
      }
      .full-day-fields label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .action-toggle {
        background: none;
        border: none;
        padding: 0;
        font-size: 12px;
        color: var(--accent);
        cursor: pointer;
        box-shadow: none;
        transform: none;
      }
      .action-toggle:hover {
        text-decoration: underline;
        box-shadow: none;
        transform: none;
      }
      .monthly-hours-input {
        width: 100%;
        min-width: 96px;
      }
      .map-wrap {
        position: relative;
        height: 300px;
        border-radius: 16px;
        border: 1px solid #efe5d6;
        background: radial-gradient(circle at 15% 20%, #fff4dd 0%, transparent 55%),
          linear-gradient(135deg, #f7efe1 0%, #eef4f2 100%);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      #map-canvas {
        height: 100%;
        width: 100%;
        border-radius: 16px;
      }
      .map-msg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 14px;
        padding: 12px;
        text-align: center;
        background: transparent;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 768px) {
        .admin-controls .field-row,
        .admin-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .admin-actions {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .admin-controls .field-row > div,
        .admin-controls .field-row > .panel,
        .admin-grid > .panel {
          width: 100%;
          max-width: 100%;
          min-width: 0;
        }
        .admin-controls input,
        .admin-controls select {
          display: block;
          width: 100%;
          max-width: 100%;
          min-height: 48px;
          min-width: 0;
          min-height: 48px;
          font-size: 16px;
        }
        .admin-login {
          gap: 10px;
          width: 100%;
          min-width: 0;
        }
        .admin-login .status-row,
        .admin-login .action-row {
          width: 100%;
          min-width: 0;
        }
        #login-state {
          width: 100%;
          max-width: 100%;
          white-space: normal;
          overflow: visible;
          text-overflow: clip;
        }
        .detail-panel-header,
        .detail-panel-actions {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
          min-width: 0;
        }
        .admin-actions button,
        .detail-panel-actions button,
        .admin-login .action-row button {
          display: block;
          width: 100%;
          max-width: 100%;
          min-height: 48px;
        }
        .table-wrap table {
          min-width: 520px;
        }
        .table-compact th,
        .table-compact td {
          white-space: nowrap;
        }
        .map-wrap {
          height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div>
          <h1>管理者ダッシュボード</h1>
          <p class="sub">月次集計、異常ログ、CSV出力をまとめて確認。</p>
        </div>
        <div class="today" id="today-label"></div>
      </div>

      <div id="login-panel" class="panel login-panel">
        <div class="login-header">
          <div>
            <p class="panel-title">管理者ログイン</p>
            <p class="login-hint">管理者アカウントでログインしてください。</p>
          </div>
          <div class="login-badge">Admin Only</div>
        </div>
        <label class="login-label" for="login-name">ユーザー名</label>
        <div class="login-field">
          <input id="login-name" type="text" placeholder="例：管理 太郎" autocomplete="username" />
        </div>
        <label class="login-label" for="login-pin">PIN (4桁)</label>
        <div class="login-field">
          <input id="login-pin" type="password" inputmode="numeric" maxlength="4" placeholder="例： 1234" autocomplete="one-time-code" />
        </div>
        <div class="login-actions">
          <button class="primary" onclick="login()">ログイン</button>
          <button class="secondary" onclick="logout()">ログアウト</button>
        </div>
      </div>

      <div class="panel admin-controls">
        <div class="hint admin-login">
          <div class="status-row">
            <span class="pill" id="login-state">未ログイン</span>
          </div>
          <div class="action-row">
            <button class="secondary" id="logout-btn">ログアウト</button>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label class="login-label" for="month-input">対象月</label>
            <input id="month-input" type="month" />
          </div>
          <div>
            <label class="login-label" for="user-select">ユーザー</label>
            <select id="user-select">
              <option value="">ユーザーを選択</option>
            </select>
          </div>
          <div class="panel">
            <div class="detail-panel-header">
              <p class="panel-title" id="monthly-hours-title">勤務条件設定</p>
              <div class="detail-panel-actions">
                <button class="secondary detail-toggle" id="monthly-hours-toggle-btn" type="button">折りたたむ</button>
              </div>
            </div>

            <div id="monthly-hours-content">
              <div class="table-wrap">
                <table class="table-compact" id="monthly-hours-table">
                  <thead>
                    <tr>
                      <th>月</th>
                      <th>所定労働時間</th>
                    </tr>
                  </thead>
                  <tbody id="monthly-hours-body"></tbody>
                </table>
              </div>

              <div class="admin-actions" style="margin-top: 12px;">
                <button class="secondary" id="load-monthly-hours">読み込み</button>
                <button class="primary" id="save-monthly-hours">一括保存</button>
              </div>
            </div>

            <div class="status" id="settings-status"></div>
          </div>

          <div class="admin-actions">
            <button class="primary" id="refresh-btn">集計を更新</button>
            <button class="secondary" id="detail-btn">詳細を表示</button>
            <button class="accent" id="csv-btn" style="display: none;">CSVダウンロード</button>
            <button class="accent" id="detail-csv-btn" style="display: none;">CSVダウンロード（月次）</button>            
            <button class="accent" id="raw-csv-btn" style="display: none;">生ログCSV</button>
            <button class="accent" id="excel-btn">Excel (印刷・サイン用)</button>
          </div>
        </div>
        <div id="status" class="status">準備完了</div>
      </div>

      <div class="admin-grid">
        <div class="panel">
          <p class="panel-title">月次サマリー</p>
          <div class="table-wrap">
            <table class="table-compact">
              <thead>
                <tr>
                  <th>ユーザー</th>
                  <th>稼働日</th>
                  <th>正常</th>
                  <th>不整合</th>
                  <th>未退室</th>
                  <th>実働</th>
                </tr>
              </thead>
              <tbody id="summary-table"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="detail-panel-header">
            <p class="panel-title">ユーザー管理</p>
            <div class="detail-panel-actions">
              <button class="secondary detail-toggle" id="user-toggle-btn" type="button">折りたたむ</button>
            </div>
          </div>
          <div class="hint">ユーザー追加 / 無効化 / 権限変更 / PIN再設定</div>

          <div id="user-panel-content">
            <div class="field-row">
              <div>
                <label class="login-label">ユーザー名</label>
                <input id="new-user-name" type="text" placeholder="例：山田 太郎" />
              </div>
              <div>
                <label class="login-label">PIN (4桁など)</label>
                <input id="new-user-pin" type="password" inputmode="numeric" />
              </div>
              <div>
                <label class="login-label">権限</label>
                <select id="new-user-role">
                  <option value="user">user</option>
                  <option value="admin">admin</option>
                </select>
              </div>

              <div class="admin-actions">
                <button class="primary" id="create-user-btn">ユーザー追加</button>
                <button class="secondary" id="reload-users-btn">一覧を更新</button>
              </div>
            </div>

            <div class="status" id="users-status"></div>

            <div class="table-wrap">
              <table class="table-compact" style="margin-top: 12px;">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>ユーザー</th>
                    <th>権限</th>
                    <th>状態</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="users-table"></tbody>
              </table>
            </div>
          </div>
        </div>


        <div class="panel">
          <div class="detail-panel-header">
            <p class="panel-title">ユーザー詳細</p>
            <div class="detail-panel-actions">
              <button class="secondary detail-toggle" id="detail-toggle-btn" type="button">折りたたむ</button>
              <button class="secondary detail-reset" id="detail-reset-btn" type="button">表示をリセット</button>
            </div>
          </div>
          <div id="detail-header" class="hint">ユーザーを選択して詳細を表示します。</div>
          <div id="detail-summary" class="detail-summary"></div>
          <div id="detail-content">
            <div class="table-wrap">
              <table class="table-compact">
                <thead>
                  <tr>
                    <th>日付</th>
                    <th>開始</th>
                    <th>終了</th>
                    <th>実働</th>
                    <th>打刻</th>
                  </tr>
                </thead>
                <tbody id="detail-table"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <p class="panel-title">打刻位置マップ</p>
        <div class="hint">最新の打刻位置を地図で確認できます。</div>
        <div id="map" class="map-wrap">
          <div id="map-canvas"></div>
          <div id="map-msg" class="map-msg">地図を読み込み中...</div>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      let map = null;
      let mapMarkers = null;
      const MAX_ACTION_CHARS = 40;
      const expandedActionRows = new Map();
      let lastDetailData = null;
      let editingLogId = null;
      let addingFullDayDate = null;
      let fillingMissingDate = null;
      let isDetailExpanded = false;
      let isMonthlyHoursExpanded = false;
      let isUserPanelExpanded = false;

      function setMapMessage(msg) {
        const msgEl = document.getElementById("map-msg");
        if (!msgEl) return;
        if (!msg) {
          msgEl.classList.add("hidden");
          msgEl.textContent = "";
          return;
        }
        msgEl.textContent = msg;
        msgEl.classList.remove("hidden");
      }

      function destroyMap() {
        if (map) {
          map.remove();
        }
        map = null;
        mapMarkers = null;

        const canvas = document.getElementById("map-canvas");
        if (canvas && canvas.parentNode) {
          const fresh = document.createElement("div");
          fresh.id = "map-canvas";
          fresh.style.height = "100%";
          fresh.style.width = "100%";
          fresh.style.borderRadius = "16px";
          canvas.parentNode.replaceChild(fresh, canvas);
        }
      }

      function ensureMap() {
        if (map) return;
        map = L.map("map-canvas").setView([35.9251, 139.4857], 14);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);
        mapMarkers = L.layerGroup().addTo(map);
      }

      function updateMap(points) {
        const valid = (points || []).filter(p => typeof p.lat === "number" && typeof p.lon === "number");
        if (valid.length === 0) {
          destroyMap();
          setMapMessage("位置情報がないため地図は表示できません。");
          return;
        }

        setMapMessage("");
        ensureMap();
        if (!mapMarkers && map) {
          mapMarkers = L.layerGroup().addTo(map);
        }
        if (!map || !mapMarkers) return;

        mapMarkers.clearLayers();
        valid.forEach(a => {
          const dateStr = a.date || "";
          L.marker([a.lat, a.lon])
            .addTo(mapMarkers)
            .bindPopup(`${dateStr}<br>${a.action}<br>${a.time}`);
        });

        if (valid.length === 1) {
          map.setView([valid[0].lat, valid[0].lon], 14);
        } else {
          const bounds = L.latLngBounds(valid.map(p => [p.lat, p.lon]));
          map.fitBounds(bounds, { padding: [24, 24] });
        }
        requestAnimationFrame(() => map.invalidateSize());
      }

      function isLoggedIn() {
        return !!sessionStorage.getItem("user");
      }

      function authHeaders() {
        return {};
      }

      async function login() {
        const name = document.getElementById("login-name").value.trim();
        const pin = document.getElementById("login-pin").value.trim();
        if (!name || !pin) {
          setStatus("ユーザー名とPINを入力してください", "error");
          return;
        }

        setStatus("ログイン中...");
        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ user: name, pin: pin })
          });
          const data = await res.json();
          if (data.ok) {
            sessionStorage.setItem("user", data.user);
            sessionStorage.setItem("role", data.role || "");
            if (data.role !== "admin") {
              setStatus("管理者権限がありません", "error");
              await logout();
              return;
            }
            setStatus(`${data.user}でログインしました`, "ok");
            applyLoginState();
            await loadSummary();
          } else {
            setStatus(data.error || "ログインできませんでした", "error");
          }
        } catch (_) {
          setStatus("通信エラーが発生しました", "error");
        }
      }

      async function logout() {
        try {
          if (session) {
            await fetch("/logout", {
              method: "POST",
              credentials:"include",
            });
          }
        } catch (_) {
        } finally {
          sessionStorage.removeItem("role");
          sessionStorage.removeItem("user");
          location.reload();
        }
      }

      function applyLoginState() {
        const loginPanel = document.getElementById("login-panel");
        const loginState = document.getElementById("login-state");
        const logoutBtn = document.getElementById("logout-btn");
        const loginName = document.getElementById("login-name");
        const loginPin = document.getElementById("login-pin");
        const user = sessionStorage.getItem("user");

        if (isLoggedIn()) {
          loginPanel.style.display = "none";
          loginState.innerText = `${user}でログイン中`;
          if (logoutBtn) logoutBtn.disabled = false;
          if (loginName) loginName.readOnly = true;
          if (loginPin) loginPin.readOnly = true;
        } else {
          loginPanel.style.display = "block";
          loginState.innerText = "未ログイン";
          if (logoutBtn) logoutBtn.disabled = true;
          if (loginName) loginName.readOnly = false;
          if (loginPin) loginPin.readOnly = false;
          document.getElementById("summary-table").innerHTML = "";
          document.getElementById("detail-table").innerHTML = "";
          document.getElementById("user-select").innerHTML = "<option value=\"\">ユーザーを選択</option>";
          document.getElementById("detail-header").innerText = "ユーザーを選択して詳細を表示します。";
        }
      }

      async function fetchWithAuth(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          credentials: "include",
          headers: { ...(options.headers || {}), ...authHeaders() }
        });

        if (res.status === 401 || res.status === 403) {
          setStatus("権限がありません。再ログインしてください。", "error");
          await logout();
          return null;
        }

        return res;
      }

      function setStatus(text, type = "info") {
        const status = document.getElementById("status");
        status.className = "status";
        if (type !== "info") {
          status.classList.add(type);
        }
        status.innerText = text;
      }

      function updateTodayLabel() {
        const today = new Date();
        const label = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
        document.getElementById("today-label").innerText = label;
      }

      function initMonth() {
        const now = new Date();
        const month = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        document.getElementById("month-input").value = month;
      }

      function buildUrl(path, params) {
        const url = new URL(path, window.location.origin);
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value) {
            url.searchParams.set(key, value);
          }
        });
        return url.pathname + url.search;
      }

      function getSelectedUserId() {

      function formatActions(actions) {
        if (!actions || actions.length === 0) return "-";
        return actions.map(a => `${a.action} ${a.time}`).join(" / ");
      }

      function toTimeInputValue(value) {
        return String(value || "").slice(0, 5);
      }

      function buildEmptyDetail(date) {
        return {
          date,
          ok: false,
          error: null,
          start: null,
          end: null,
          net: "-",
          action: [],
        };
      }

      function getMissingLogType(day) {
        const actions = day && day.action ? day.action : [];
        const hasIn = actions.some((a) => a.action === "入室");
        const hasOut = actions.some((a) => a.action === "退室");
        if (hasIn && !hasOut) return "退室";
        if (!hasIn && hasOut) return "入室";
        return null;
      }

      function buildCalendarDetails(month, details) {
        if (!month) return details || [];
        const [year, mon] = month.split("-").map(Number);
        if (!year || !mon) return details || [];
        const totalDays = new Date(year, mon, 0).getDate();
        const byDate = new Map((details || []).map((day) => [day.date, day]));
        const rows = [];
        for (let day = 1; day <= totalDays; day += 1) {
          const date = `${year}-${String(mon).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          rows.push(byDate.get(date) || buildEmptyDetail(date));
        }
        return rows;
      }

      function renderFullDayAddControls(date, userId, actions) {
        if (!userId) return "";
        if (actions && actions.length > 0) return "";
        const isAdding = addingFullDayDate === date;
        if (!isAdding) {
          return `
            <div class="full-day-add">
              <button class="mini-btn secondary add-full-day-btn" data-action="start-full-day" data-date="${date}" data-user-id="${userId}">1日分追加</button>
            </div>
          `;
        }
        return `
          <div class="full-day-add">
            <div class="full-day-fields">
              <label>入室 <input class="inline-time" type="time" data-role="clock-in-input" value="09:00" /></label>
              <label>退室 <input class="inline-time" type="time" data-role="clock-out-input" value="18:00" /></label>
              <button class="mini-btn" data-action="save-full-day" data-date="${date}" data-user-id="${userId}">保存</button>
              <button class="mini-btn secondary" data-action="cancel-full-day">キャンセル</button>
            </div>
          </div>
        `;
      }

      function renderMissingLogControls(day, userId) {
        if (!userId) return "";
        const missingType = getMissingLogType(day);
        if (!missingType) return "";
        const isFilling = fillingMissingDate === day.date;
        const defaultTime = missingType === "入室" ? "09:00" : "18:00";
        if (!isFilling) {
          return `
            <div class="full-day-add">
              <button class="mini-btn secondary" data-action="start-fill-missing" data-date="${day.date}" data-user-id="${userId}" data-type="${missingType}">${missingType}補完</button>
            </div>
          `;
        }
        return `
          <div class="full-day-add">
            <div class="full-day-fields">
              <label>${missingType} <input class="inline-time" type="time" data-role="missing-time-input" value="${defaultTime}" /></label>
              <button class="mini-btn" data-action="save-fill-missing" data-date="${day.date}" data-user-id="${userId}" data-type="${missingType}">保存</button>
              <button class="mini-btn secondary" data-action="cancel-fill-missing">キャンセル</button>
            </div>
          </div>
        `;
      }

      function renderActionList(actions, date) {
        return `
          <div class="action-list">
            ${actions.map((a) => {
              const isEditing = editingLogId === Number(a.id);
              const safeAction = escapeHtml(a.action || "");
              const safeTime = escapeHtml(a.time || "");
              const inputValue = escapeHtml(toTimeInputValue(a.time));
              return `
                <div class="action-item${isEditing ? " editing" : ""}">
                  <span>${safeAction}</span>
                  ${isEditing
                    ? `<input class="inline-time" type="time" value="${inputValue}" data-role="time-input" data-log-id="${a.id}" />
                       <button class="mini-btn" data-action="save-log" data-log-id="${a.id}" data-date="${date}">保存</button>
                       <button class="mini-btn secondary" data-action="cancel-edit">キャンセル</button>`
                    : `<span class="action-time">${safeTime}</span>
                       <button class="mini-btn secondary" data-action="edit-log" data-log-id="${a.id}">編集</button>`}
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function truncateActions(text) {
        if (text.length <= MAX_ACTION_CHARS) {
          return { text, truncated: false };
        }
        return { text: `${text.slice(0, MAX_ACTION_CHARS)}…`, truncated: true };
      }

      function renderDetail(data) {
        const table = document.getElementById("detail-table");
        const summaryEl = document.getElementById("detail-summary");
        table.innerHTML = "";

        if (!data || !data.details || data.details.length === 0) {
          table.innerHTML = "<tr><td colspan=\"5\">詳細がありません。</td></tr>";
          if (summaryEl) summaryEl.innerText = "";
          updateMap([]);
          return;
        }
       
        const allActions = [];
        data.details.forEach(d => {
          d.action.forEach(a => {
            if (typeof a.lat === "number" && typeof a.lon === "number") {
              allActions.push({ ...a, date: d.date });
            }
          });
        });
        updateMap(allActions);
        
        let okCount = 0;
        let ngCount = 0;
        let daysWithLogs = 0;

        data.details.forEach(day => {
          if ((day.action || []).length > 0) {
            daysWithLogs += 1;
            if (day.ok) {
              okCount += 1;
            } else {
              ngCount += 1;
            }
          }
          const key = day.date;
          const fullActions = formatActions(day.action);
          const isExpanded = expandedActionRows.get(key) === true;
          const truncated = truncateActions(fullActions);
          const shouldShowActionList = fullActions !== "-" && (!truncated.truncated || isExpanded);
          const displayActions = shouldShowActionList ? renderActionList(day.action || [], key) : escapeHtml(truncated.text);
          const showToggle = fullActions !== "-" && (truncated.truncated || isExpanded);
          const toggleLabel = isExpanded ? "折りたたむ" : "もっと見る";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${day.date}</td>
            <td>${day.start || "-"}</td>
            <td>${day.end || "-"}</td>
            <td>${day.net}</td>
            <td>
              <div class="action-cell">
                <div class="action-text">${displayActions}</div>
                ${renderFullDayAddControls(key, data.user_id, day.action || [])}
                ${renderMissingLogControls(day, data.user_id)}
                ${showToggle ? `<button class="action-toggle" data-action="toggle-action" data-date="${key}">${toggleLabel}</button>` : ""}
              </div>
            </td>
          `;
          table.appendChild(tr);
        });

        if (summaryEl) {
          summaryEl.innerText = `全${data.details.length}日（打刻あり:${daysWithLogs} / OK:${okCount} / 不整合:${ngCount}）`;
        }
      }

      document.getElementById("detail-table").addEventListener("click", (event) => {
        const target = event.target.closest("button[data-action]");
        if (!target) return;

        if (target.dataset.action === "toggle-action") {
          const key = target.dataset.date;
          const current = expandedActionRows.get(key) === true;
          expandedActionRows.set(key, !current);
          editingLogId = null;
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "start-full-day") {
          addingFullDayDate = target.dataset.date || null;
          fillingMissingDate = null;
          editingLogId = null;
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "cancel-full-day") {
          addingFullDayDate = null;
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "start-fill-missing") {
          fillingMissingDate = target.dataset.date || null;
          addingFullDayDate = null;
          editingLogId = null;
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "cancel-fill-missing") {
          fillingMissingDate = null;
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "edit-log") {
          addingFullDayDate = null;
          fillingMissingDate = null;
          editingLogId = Number(target.dataset.logId);
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "cancel-edit") {
          editingLogId = null;
          if (lastDetailData) {
            renderDetail(lastDetailData);
          }
          return;
        }

        if (target.dataset.action === "save-log") {
          const logId = Number(target.dataset.logId);
          const date = target.dataset.date;
          const row = target.closest(".action-item");
          const input = row ? row.querySelector("input[data-role='time-input']") : null;
          const time = input ? input.value : "";
          if (!date || !time) {
            alert("時刻を入力してください");
            return;
          }
          updateLog(logId, date, time);
          return;
        }

        if (target.dataset.action === "save-full-day") {
          const userId = Number(target.dataset.userId);
          const date = target.dataset.date;
          const wrap = target.closest(".full-day-add");
          const clockInInput = wrap ? wrap.querySelector("input[data-role='clock-in-input']") : null;
          const clockOutInput = wrap ? wrap.querySelector("input[data-role='clock-out-input']") : null;
          const clockIn = clockInInput ? clockInInput.value : "";
          const clockOut = clockOutInput ? clockOutInput.value : "";
          if (!date || !clockIn || !clockOut) {
            alert("入室時刻と退室時刻を入力してください");
            return;
          }
          if (clockIn >= clockOut) {
            alert("入室時刻は退室時刻より前にしてください");
            return;
          }
          addFullDayLog(userId, date, clockIn, clockOut);
          return;
        }

        if (target.dataset.action === "save-fill-missing") {
          const userId = Number(target.dataset.userId);
          const date = target.dataset.date;
          const type = target.dataset.type;
          const wrap = target.closest(".full-day-add");
          const timeInput = wrap ? wrap.querySelector("input[data-role='missing-time-input']") : null;
          const inputTime = timeInput ? timeInput.value : "";
          if (!date || !type || !inputTime) {
            alert("時刻を入力してください");
            return;
          }
          fillMissingLog(userId, date, type, inputTime);
        }
      });
      
      async function downloadRawCsv() {
        if (!isLoggedIn()) {
          setStatus("ログインしてください", "error");
          return;
        }
        const month = document.getElementById("month-input").value;
        if (!month) {
          setStatus("対象月を選択してください", "error");
        }
        const user = document.getElementById("user-select").value;

        setStatus("生ログCSVを作成中...");
        const res = await fetchWithAuth(buildUrl("/admin/raw-logs.csv", { month, user }))
        if (!res) return;
        
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = user ? `raw-logs_${month}_${user}.csv` : `raw-logs_${month}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        setStatus("生ログCSVをダウンロードしました", "ok");
      }
      
      document.getElementById("raw-csv-btn").addEventListener("click", downloadRawCsv);
      document.getElementById("logout-btn").addEventListener("click", logout);
      document.getElementById("excel-btn").addEventListener("click", downloadExcel);
      document.getElementById("detail-csv-btn").addEventListener("click", downloadDetailCsv)
      document.getElementById("csv-btn").addEventListener("click", downloadCsv);
      document.getElementById("refresh-btn").addEventListener("click", loadSummary);
      document.getElementById("detail-btn").addEventListener("click", loadUserDetail);
      document.getElementById("user-select").addEventListener("change", handleMonthlyHoursContextChange);
      document.getElementById("month-input").addEventListener("change", handleMonthlyHoursContextChange);
      updateDetailPanelState();
      updateMonthlyHoursPanelState();

      async function ensureAdminSession() {
        if (!isLoggedIn()) return false;

        const res = await fetchWithAuth("/admin/ping");
        if (!res) return false;

        const data = await res.json();
        if (!data.ok) {
          sessionStorage.removeItem("user");
          sessionStorage.removeItem("role");
          await logout();
          return false;
        }

        sessionStorage.setItem("user", data.user);
        sessionStorage.setItem("role", "admin")
        return true
      }

      function setUserStatus(text, type="info") {
        const el = document.getElementById("users-status");
        if (!el) return;
        el.className = "status";
        if (type !== "info") el.classList.add(type);
        el.innerText = text;
      }

      function escapeHtml(s) {
        return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
      }

      async function loadUsers() {
        setUserStatus("ユーザー一覧を取得中...");
        const res = await fetchWithAuth("/admin/users");
        if (!res) return;
        const data = await res.json();
        if (!data.ok) {
          setUserStatus(data.error || "取得に失敗しました", "error");
          return;
        }
        renderUsers(data.users || []);
        setUserStatus("更新しました", "ok");
      }

      function renderUsers(users) {
        const tbody = document.getElementById("users-table");
        if (!tbody) return;
        tbody.innerHTML = "";

        if (!users || users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5">ユーザーがいません</td></tr>`;
          return;
        }

        users.forEach(u => {
          const tr = document.createElement("tr");
          const isActive = !!u.is_active;
          const role = u.role || "user";

          tr.innerHTML = `
            <td>${u.id}</td>
            <td>${escapeHtml(u.name)}</td>
            <td>
              <select data-action="role" data-name="${escapeHtml(u.name)}">
                <option value="user" ${role === "user" ? "selected" : ""}>user</option>
                <option value="admin" ${role === "admin" ? "selected" : ""}>admin</option>
              </select>
            </td>
            <td>
              <select data-action="active" data-name="${escapeHtml(u.name)}">
                <option value="true" ${isActive ? "selected" : ""}>active</option>
                <option value="false" ${!isActive ? "selected" : ""}>inactive</option>
              </select>
            </td>
            <td style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="secondary" data-action="reset-pin" data-name="${escapeHtml(u.name)}">PIN再設定</button>
            </td>
          `;
          tbody.appendChild(tr);          
        });
      }

      async function createUser() {
        const name = document.getElementById("new-user-name").value.trim();
        const pin = document.getElementById("new-user-pin").value.trim();
        const role = document.getElementById("new-user-role").value.trim();

        if (!name || !pin) {
          setUserStatus("ユーザー名とPINを入力してください", "error");
          return;
        }

        setUserStatus("作成中...");
        const res = await fetchWithAuth("/admin/users", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({name, pin, role}),
        });
        if (!res) return;

        if (!res.ok) {
          const msg = await res.text();
          setUserStatus(`作成に失敗: ${msg}`, "error");
          return;
        }

        setUserStatus("作成しました", "ok");
        document.getElementById("new-user-pin").value = "";
        await loadUsers()
      }

      async function updateUser(payload) {
        const res = await fetchWithAuth("/admin/users", {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        if (!res) return null;
        const data = await res.json().catch(() => null);
        if (!res.ok || !data || !data.ok) {
          setUserStatus((data && (data.detail || data.error)) || "更新に失敗しました", "error")
          return null;
        }
        return data.user;
      }

      document.getElementById("users-table").addEventListener("change", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLSelectElement)) return;

        const action = target.dataset.action;
        const name = target.dataset.name;
        if (!action || !name) return;

        if (action === "role") {
          setUserStatus("権限を更新中...");
          await updateUser({ name, role: target.value });
          setUserStatus("更新しました", "ok");
          return;
        }

        if (action === "active") {
          setUserStatus("状態を更新中...");
          const is_active = target.value === "true";
          await updateUser({ name, is_active });
          setUserStatus("更新しました", "ok");
          return;
        }
      })

      document.getElementById("users-table").addEventListener("click", async (event) => {
        const btn = event.target.closest("button[data-action='reset-pin']");
        if (!btn) return;

        const name = btn.dataset.name;
        if (!name) return;

        const pin = prompt(`${name} の新しいPINを入力してください`);
        if (!pin) return;

        setUserStatus("PINを更新中...");
        await updateUser({ name, pin });
        setUserStatus("PINを更新しました", "ok");
      });
      
      document.getElementById("create-user-btn").addEventListener("click", createUser);
      document.getElementById("reload-users-btn").addEventListener("click", loadUsers);

      (async () => {
        initMonth();
        updateTodayLabel();
        applyLoginState();
        updateUserPanelState();
        
        if (await ensureAdminSession()) {
          applyLoginState();
          loadSummary();
          loadUsers();
        } else {
          applyLoginState();
        }
      })();
    </script>
  </body>
</html>
